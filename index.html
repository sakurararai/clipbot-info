<title>clipbot</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d1f; --muted: #5f6368; --bg: #fafaf7; --accent: #2f5bd3; }

  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.8 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
  h1 { font-size: 2rem; letter-spacing: .02em; margin: 0 0 1.5rem; }
  p { margin: 0 0 1rem; }

</style>

<body>
<main>
  <h1>clipbot</h1>
  <p>clipbot は、運営者が個人で使う動画素材の整理ツールです。</p>
  <p>Discord に投稿されたタイムスタンプをもとに配信動画の一部を切り出し、運営者自身の Google ドライブの指定フォルダに保存します。</p>
  <p class="note">一般向けには提供していません。</p>
  <p><a href="privacy.html">プライバシーポリシー</a></p>
